<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Specification, execution, artifact, and lineage relationship</title>
  <desc id="desc">A specification configures an execution, which consumes ordered input artifacts and produces ordered output artifacts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".08"/></filter>
    <style>.title{font:700 30px Inter,Segoe UI,Arial,sans-serif;fill:#111827}.subtitle{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}.label{font:700 19px Inter,Segoe UI,Arial,sans-serif;fill:#172033}.small{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1600" height="760" fill="#f8fafc"/>
  <text class="title" x="800" y="58" text-anchor="middle">Data lineage</text>

  <rect x="620" y="145" width="360" height="120" rx="18" fill="#ffedaa" stroke="#c45f06" stroke-width="3" filter="url(#shadow)"/>
  <text class="label" x="800" y="198" text-anchor="middle">Specification</text><text class="small" x="800" y="230" text-anchor="middle">Canonical JSON and content hash</text>

  <path class="line" d="M800 265V365"/><text class="small" x="825" y="322">configures</text>
  <rect x="620" y="370" width="360" height="135" rx="18" fill="#dff3ff" stroke="#0878b8" stroke-width="3" filter="url(#shadow)"/>
  <text class="label" x="800" y="425" text-anchor="middle">Execution</text><text class="small" x="800" y="457" text-anchor="middle">Status, attempts, timing, errors</text><text class="small" x="800" y="482" text-anchor="middle">One operation attempt</text>

  <rect x="90" y="377" width="350" height="120" rx="18" fill="#e8edf3" stroke="#475569" stroke-width="3" filter="url(#shadow)"/>
  <text class="label" x="265" y="430" text-anchor="middle">Input artifacts</text><text class="small" x="265" y="462" text-anchor="middle">Ordered, versioned, project scoped</text>
  <path class="line" d="M440 437H610"/><text class="small" x="525" y="414" text-anchor="middle">Inputs</text>

  <rect x="1160" y="377" width="350" height="120" rx="18" fill="#d9f7e4" stroke="#168447" stroke-width="3" filter="url(#shadow)"/>
  <text class="label" x="1335" y="430" text-anchor="middle">Output artifacts</text><text class="small" x="1335" y="462" text-anchor="middle">Ordered, immutable, traceable</text>
  <path class="line" d="M980 437H1150"/><text class="small" x="1065" y="414" text-anchor="middle">Outputs</text>

</svg>

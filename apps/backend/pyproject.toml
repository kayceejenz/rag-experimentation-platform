[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragapp-backend"
version = "0.1.0"
description = "Project-scoped retrieval-augmented chat backend."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "psycopg[binary]>=3.2.0",
  "argon2-cffi>=25.1.0",
  "PyJWT[crypto]>=2.10.0",
  "unstructured-client>=0.46.1,<0.47.0",
  "boto3>=1.35.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.34.0",
  "psycopg-pool>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1.390",
]

[project.scripts]
ragapp-api = "api.main:run"
ragapp-worker = "worker:main"
ragapp-migrate = "migrate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/core", "src/integrations", "src/modules"]

[tool.hatch.build.targets.wheel.force-include]
"src/worker.py" = "worker.py"
"src/migrate.py" = "migrate.py"
"src/migrations" = "migrations"

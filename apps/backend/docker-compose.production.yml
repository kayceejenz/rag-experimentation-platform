name: ragapp-production

x-backend: &backend
        build:
                context: .
                dockerfile: Dockerfile
        env_file:
                - ${RAGAPP_ENV_FILE:-.env.production}
        init: true
        restart: unless-stopped
        security_opt:
                - no-new-privileges:true
        cap_drop:
                - ALL
        read_only: true
        tmpfs:
                - /tmp:size=256m,mode=1777
        logging:
                driver: json-file
                options:
                        max-size: 10m
                        max-file: '3'

services:
        api:
                <<: *backend
                command: ragapp-api
                environment:
                        APP_ENV: production
                        API_HOST: 0.0.0.0
                        API_PORT: 8000
                ports:
                        - '${API_BIND_ADDRESS:-127.0.0.1}:${API_PUBLIC_PORT:-8000}:8000'
                healthcheck:
                        test:
                                - CMD
                                - python
                                - -c
                                - >-
                                        import urllib.request;
                                        urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()
                        interval: 20s
                        timeout: 5s
                        retries: 5
                        start_period: 20s
                stop_grace_period: 30s

        worker:
                <<: *backend
                command: ragapp-worker
                environment:
                        APP_ENV: production
                stop_grace_period: 45s

        migrate:
                <<: *backend
                profiles: [tools]
                command: ragapp-migrate
                restart: 'no'
                environment:
                        APP_ENV: production
                        MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
